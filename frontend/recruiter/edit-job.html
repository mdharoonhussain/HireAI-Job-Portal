<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Job</title>
    <link rel="icon" type="image/png" href="../images/logo.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body>
    <nav class="navbar">
      <h2 class="logo">HireAI</h2>

      <div class="nav-right">
        <a href="dashboard.html" class="dashboard-link"> Dashboard </a>

        <button id="logoutBtn">Logout</button>
      </div>
    </nav>

    <div class="dashboard-container">
      <h1>Edit Job</h1>

      <div class="form-card">
        <form id="jobForm">
          <input type="text" id="title" placeholder="Job Title" />

          <input type="text" id="company" placeholder="Company Name" />

          <input type="text" id="location" placeholder="Location" />

          <input type="text" id="salary" placeholder="Salary (Ex: 8-12 LPA)" />

          <textarea id="description" placeholder="Job Description"></textarea>

          <input
            type="text"
            id="skills"
            placeholder="Skills (HTML,CSS,JavaScript)"
          />

          <button type="submit">Update Job</button>
        </form>
      </div>
    </div>

    <!-- Logout Modal -->

    <div id="logoutModal" class="modal">
      <div class="modal-content">
        <h2>Logout</h2>

        <p>Are you sure you want to logout?</p>

        <div class="modal-buttons">
          <button id="cancelLogout" class="cancel-btn">Cancel</button>

          <button id="confirmLogout" class="confirm-btn">Logout</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/editJob.js"></script>
  </body>
</html>
