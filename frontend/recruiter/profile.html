<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recruiter Profile</title>
    <link rel="icon" type="image/png" href="../images/logo.png" />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body>
    <nav class="navbar">
      <h2 class="logo">HireAI</h2>

      <div class="nav-right">
        <a href="dashboard.html" class="dashboard-link"> Dashboard </a>

        <button id="logoutBtn">Logout</button>
      </div>
    </nav>

    <div class="dashboard-container">
      <h1>Recruiter Profile</h1>

      <div class="profile-card">
        <div class="form-group">
          <label>Recruiter Name</label>

          <input type="text" id="name" />
        </div>

        <div class="form-group">
          <label>Email</label>

          <input type="email" id="email" disabled />
        </div>

        <div class="form-group">
          <label>Phone</label>

          <input type="text" id="phone" />
        </div>

        <div class="form-group">
          <label>Company Name</label>

          <input type="text" id="companyName" />
        </div>

        <div class="form-group">
          <label>Company Website</label>

          <input type="text" id="companyWebsite" />
        </div>

        <div class="form-group">
          <label>Company Location</label>

          <input type="text" id="companyLocation" />
        </div>

        <div class="form-group">
          <label>Company Description</label>

          <textarea id="companyDescription" rows="5"></textarea>
        </div>

        <button id="saveProfileBtn">Save Profile</button>
        <button id="openChangePasswordBtn" class="change-password-btn-recruiter" type="button">Update Password</button>
      </div>
    </div>

    <!-- Logout Modal -->

    <div id="logoutModal" class="modal">
      <div class="modal-content">
        <h2>Logout</h2>

        <p>Are you sure you want to logout?</p>

        <div class="modal-buttons">
          <button id="cancelLogout" class="cancel-btn">Cancel</button>

          <button id="confirmLogout" class="confirm-btn">Logout</button>
        </div>
      </div>
    </div>

    <!-- Change Password Modal -->
    <div id="changePasswordModal" class="modal">
      <div class="modal-content" style="text-align: left;">
        <h2 style="margin-bottom: 20px; text-align: center;">Update Password</h2>
        <form id="changePasswordForm">
          <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600;">Current Password</label>
            <input type="password" id="currentPassword" placeholder="Current Password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px;" />
          </div>
          <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600;">New Password</label>
            <input type="password" id="newPassword" placeholder="New Password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px;" />
          </div>
          <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600;">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px;" />
            <span id="passwordMatchMessage" class="password-status-message"></span>
          </div>
          <div class="modal-buttons" style="display: flex; gap: 15px; margin-top: 20px;">
            <button type="button" id="cancelChangePassword" class="cancel-btn">Cancel</button>
            <button type="submit" id="confirmChangePassword" class="confirm-btn" style="background: #2563eb;">Update</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../js/utils.js"></script>

    <script src="../js/profile.js"></script>
  </body>
</html>
